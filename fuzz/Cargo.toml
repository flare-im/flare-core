[package]
name = "flare-core-fuzz"
license = "Apache-2.0"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.flare-core]
path = ".."

# 每个 target 单独声明，且关掉 doctest/bench —— cargo-fuzz 的标准布局。
[[bin]]
name = "parse_frame"
path = "fuzz_targets/parse_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decompress"
path = "fuzz_targets/decompress.rs"
test = false
doc = false
bench = false
